<body data-page="twitch">
  <header id="site-header"></header>

  <main class="wrap">
    <!-- Streams ganz oben, rechts daneben der Zeitplan -->
    <section class="streams-head">
      <div>
        <h1>TFT Live Streams</h1>
        <p class="live-summary" id="live-count"></p>
      </div>
      <a class="link-arrow is-twitch" href="twitch/live-streams.html">All live streams<span data-icon="arrow"></span></a>
    </section>

    <div class="streams-top">
      <section aria-label="Live now">
        <div id="live-now"></div>
      </section>

      <aside class="side-card stream-teaser tt-card" aria-labelledby="tt-title">
        <div class="side-stage">
          <h2 id="tt-title">Timetable</h2>
          <img class="janna janna-fan at-r" src="assets/img/janna/janna-fan-bust.png" alt="" decoding="async" />
        </div>
        <div class="tt-list" id="broadcasts"></div>
        <a class="link-arrow" href="tft-tacticians-crown.html#watch">World Championship stream<span data-icon="arrow"></span></a>
      </aside>
    </div>

    <section class="twitch-band" aria-labelledby="creators-title">
      <div class="section-head">
        <span class="twitch-mark"><span data-icon="twitch"></span></span>
        <div>
          <h2 id="creators-title">Streamer profiles</h2>
          <p class="section-sub">Hand-picked TFT streamers with their live status – visible even when they are offline.</p>
        </div>
      </div>
      <div class="grid-3 show-all" id="creators"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/data/turniere.js"></script>
  <script src="assets/js/app.js"></script>
